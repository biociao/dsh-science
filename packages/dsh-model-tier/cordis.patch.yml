# dsh-model-tier bundle patch — 模型分档路由（按任务难易度自动选择模型，跨 provider）。
#
# 条目名使用包根名 `dsh-model-tier`（经 exports["."] 指向 engines/model-tier.mjs），
# 与 client-modules 的 dsh.client 定位约定一致（按 loader 条目名解析 package.json）。
- insert:
    # 模型分档路由引擎（HOST 平面）：同一会话内自动把辅助请求（会话标题、压缩）
    # 与子任务分流到轻量档，主对话走默认档，复杂任务按规则升级到强档。
    # 各档位可指向不同 provider（示例：强档 zai-coding-cn/glm-5.3、主档
    # deepseek-official/deepseek-v4-flash、轻档 opencode-go/minimax-m2.7）。
    # 语义：注册虚拟 provider「智能分档」（id=model-tier），每个分档方案是其下
    # 的一个"模型"；会话在模型选择器选中方案后才按规则路由（按会话 opt-in，
    # 无全局路由）。未配置档位时选择器不出现方案，因此该配置可安全随包发布。
    # 详见 README。
    - id: model-tier
      name: dsh-model-tier
      config:
        tiers:
          strong:
            provider: zai-coding-cn
            model: glm-5.3
          default:
            provider: deepseek-official
            model: deepseek-v4-flash
          light:
            provider: opencode-go
            model: minimax-m2.7
        routing:
          auxiliary: [session-title, compaction]
          subagents: light
          # 深链子任务（delegationDepth >= 3）升级到强档（可选）
          subagentDepthStrong: 3
          # 单步用户输入超长时升级到强档（可选启发式，按需开启）
          # escalateOnChars: 40000
          # classify: true              # 可选：LLM 前置分类器（每次提问/子任务派发前
          #                             # 分类 light/default/strong，缺省用轻档模型）
    # 「智能分档」设置页的宿主侧：webServer 前缀路由 /dsh-model-tier/*（当前配置 /
    # provider 模型清单 / 保存 / 恢复默认）。设置页写入 $DSH_HOME/model-tier.json，
    # 路由引擎按 mtime 热加载。config 与上面 model-tier 行保持一致（作为界面展示基线）。
    # 客户端 bundle 由 package.json 的 dsh.client 声明
    # （client/model-tier-ui/lib/client.js，scripts/build-client-bundle.mjs 生成）。
    - id: model-tier-ui
      name: dsh-model-tier/engines/model-tier-ui.mjs
      config:
        tiers:
          strong:
            provider: zai-coding-cn
            model: glm-5.3
          default:
            provider: deepseek-official
            model: deepseek-v4-flash
          light:
            provider: opencode-go
            model: minimax-m2.7
        routing:
          auxiliary: [session-title, compaction]
          subagents: light
          subagentDepthStrong: 3
