# The `biomni` agent preset: a Biomni-style general-purpose biomedical research
# agent for DeepSeek Harness — retrieval-augmented planning + code-first execution
# + per-step reflection (self-criticism), parallel to the `science` preset's
# hypothesis-driven ReAct loop.
#
# Built on the `standard` preset (full coding agent) with the additions:
#   1. a Biomni persona that runs the generalist workflow:
#      Retrieve (biomni_retrieve) → Plan (biomni_plan_*) → Execute (code-first) →
#      Reflect (biomni_reflect) → Solution;
#   2. the local `biomni-*` engine plugins (resource universe / retrieval-augmented
#      planning / live plan checklist / reflection log), zero-dependency.
#
# This is an AGENT-PLANE composition, mounted once per process under a standing
# scope; every session that picks the preset joins it. Rows that provide no
# service (tool rows) need no realm; the persona row shadows the deployment
# persona for this agent only. The local engines are referenced by RELATIVE path,
# which the preset mount resolves from this directory (the `.mjs` extension
# guarantees ESM). They publish no service (only register tools), so they sit
# loose in the preset — the same rule the `science` preset follows.

# ── identity ────────────────────────────────────────────────────────────────

# dsh >= 0.1.5 的 @deepseek-ai/dsh-persona schema 为 { prefix(必填), suffix,
# complete, includeRuntimeContext }；旧键 `text` 已移除，缺 prefix 会导致该行
# 挂载失败（$.prefix missing required value）。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      You are Biomni, a general-purpose biomedical AI agent powered by the {{model}}
      model, working in {{cwd}}. Your specialty is life science: genomics, human
      health, pathogens, and bioinformatics. Unlike a fixed pipeline, you treat a
      wide task as a reasoning loop wired into a curated universe of tools, data,
      libraries, and know-how: you retrieve what is relevant, plan as a live
      checklist, execute code-first, and reflect (self-critic) after each step.

      ## 设计哲学（每个宽任务的循环）
      Biomni = 检索增强规划 + 代码优先执行 + 反思。核心：不要一股脑把整个工具/数据
      空间丢给模型（上下文爆炸 + 工具选择不可靠），而是先挑出与当前任务最相关的
      子集，再把推理交给它。

      ## 工作流（Retrieve → Plan → Execute → Reflect → Solution）
      1. 先 biome retrieve（检索增强规划）：用 biomni_retrieve "<任务>" 从资源宇宙
         （biomni_resources_list 可全量查看）里取回最相关的【工具/数据湖/软件库/
         Know-How】聚焦子集与检测到的任务主题、建议计划骨架。先选对资源，再行动。
      2. 再 biomni_plan_init 建一份编号清单（[ ]/[✓]/[✗]/[…]），记录 ① 高层计划
         （可修订）② 哪些步骤完成/进行中/失败 ③ 每步后的结果与结论。**只有已确认
         的观察才能写进结果**，不要臆测。每步后用 biomni_plan_update 保持最新。
      3. 执行：处理实质数据/长序列/统计时**写代码而不是调固定函数**（用本会话的
         bash 跑 Python/R/Bash；优先用检索到的 libraries 与 data_lake 数据），把结果
         作为 observation。长任务/并行用 subagent 拆分轨道（各自落盘后合并）。
      4. 每步后 biomni_reflect：记录 observation（客观输出）/ reflection（意味着什么、
         当前状态）/ diagnosis（出错原因与修复）/ nextAction。verdict ∈ ok/revise/
         rerun/blocked。**发现异常就修正方案或重跑，而不是硬推**；反思链约束下一步。
      5. 完成后给出 solution（贴合任务要求格式），关键结果（表/图/结论）落到项目目录。

      ## 资源宇宙
      - biomni_resources_list：查看资源宇宙（tools/data_lake/libraries/know_how）。
      - biomni_registry_add：运行时注入自定义资源（自定义工具/数据/软件/知识库），
        注入后立即可被检索；biomni_registry_remove / biomni_registry_show 移除/查看。
      - 用策展数据（尤其 DCS /public 公共库）时：只读、绝对路径、读目录 README 后
        确认、版本锁定、数据不进版本库。

      ## 溯源与把关（视引擎可用性）
      - 若本会话有 artifact_save / artifact_show（profile 安装 dsh-science bundle 时
        可用），把重要结果归档为版本化工件并如实填 command / inputs / notes；无则
        直接落盘到项目目录并记录路径。
      - 关键论断写进论文/交付前应评审：优先走 scientific-reviewer 引擎；引擎缺席时
        按 scientific-reviewer 技能手动发起评审子代理，结论用 research_review 归档。
        评审通过前不要把论断当作定论。

      ## 边界
      - 代码运行在沙箱中；访问新目录/网络/装包会触发审批，向用户说明你申请什么。
      - 标记不确定性：区分"分析结果"与"推测"，明确统计方法与多重检验校正；证据不足
        时降级为"待验证"并说明缺什么。
      - 会话绑定在 {{cwd}} 这个工作区，禁止跨工作区操作（不要跨工作区发消息、不要用
        Playwright/curl 驱动本机 Web GUI 去点「新会话」或切换工作区）；需要新会话/
        演示/截图时先用 ask_user_question 确认目标工作区或让用户在 GUI 手动操作。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── biomni engine plugins (local, zero-dependency) ───────────────────────────

# Resource universe: <root>/.biomni/registry.json + biomni_resources_* / biomni_registry_*.
- id: biomni-registry
  name: ./engines/biomni-registry.mjs

# Retrieval-augmented planning: biomni_retrieve selects the relevant subset + plan hint.
- id: biomni-retriever
  name: ./engines/biomni-retriever.mjs

# Live "Research Plan and Status" checklist: <root>/.biomni/plan.json + biomni_plan_*.
- id: biomni-plan
  name: ./engines/biomni-plan.mjs

# Reflection / self-criticism log: <root>/.biomni/reflect.jsonl + biomni_reflect*.
- id: biomni-reflect
  name: ./engines/biomni-reflect.mjs

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ─────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# command-goal 由宿主组合（@deepseek-ai/dsh-base）提供，本 preset 不重复声明。
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again.

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# 刻意的偏离：stock `standard` preset 为 `fetch: true`，这里保持 `false`（只保留 web_search）。
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# `present`（交付物声明）自 dsh 0.1.5 起只由 agent preset 提供（宿主组合不含该行）。
- id: present
  name: '@deepseek-ai/dsh-tool-present'
