# dsh-science bundle patch — inserts the zero-dependency science engines
# into a profile's layer stack (installable via `dsh plugin add <pkg>`).
#
# IMPORTANT: engine rows are referenced by PACKAGE SUBPATH EXPORT
# (`dsh-science/engines/*.mjs`), not by relative path. The profile loader
# resolves relative names against the *profile directory*, so `./engines/...`
# breaks inside a bundle; subpath exports resolve from the profile's
# node_modules. Verified experimentally on dsh 0.1.0-rc.6.
- insert:
    - id: science-research-loop
      name: dsh-science/engines/research-loop.mjs
    - id: science-artifact-registry
      name: dsh-science/engines/artifact-registry.mjs
    - id: science-remote-compute
      name: dsh-science/engines/remote-compute.mjs
      config:
        # 远程作业每次提交默认要求审批（等价于 Claude Science 的 "Run this job on <host>?" 卡）。
        # requireHostAccess：首次使用某主机默认审批并写入本项目白名单（allowlist.json）。
        # 无人值守/CI 场景请将两者改为 false。
        requireApproval: true
        requireHostAccess: true
    # 远程主机配置 UI 的宿主侧：为浏览器设置页提供 REST API（webServer 前缀路由
    # /dsh-science/remote-hosts/*），读写与 remote-compute 引擎同一套 hosts/白名单/作业
    # 文件，并支持真实 ssh 只读探测。客户端 bundle 由 package.json 的 dsh.client 声明
    # （client/remote-hosts-ui/lib/client.js，scripts/build-client-bundle.mjs 生成）。
    # 注意：本行 name 必须是包根名 `dsh-science`（经 exports["."] 指向
    # engines/remote-hosts-ui.mjs）——client-modules 按 loader 条目名
    # require.resolve("<name>/package.json") 定位 dsh.client 声明，子路径条目名
    # 解析不到 package.json，客户端 bundle 会被静默跳过（设置页不出现）。
    - id: science-remote-hosts-ui
      name: dsh-science
    # 科研工作台引擎：多项目分类与状态管理（research_workbench / research_project_list /
    # research_project_show / research_project_register / research_project_classify），
    # 维护 <工作台根>/.dsh/workbench.json 注册表（分类/标签/优先级/生命周期状态/备注），
    # 自动扫描工作区子目录里含 research-manifest.json 的项目收录，并聚合每个项目的状态
    # （循环阶段、假设/实验状态分布、工件数、待处理评审、远程作业、最近活跃）。
    # preset「科学模式」同样挂载本引擎（agent 工具），此处让 bundle 形态 profile 的
    # agent 也获得这些工具。
    - id: science-research-workbench
      name: dsh-science/engines/workbench.mjs
    # 科研工作台 Web 面板的宿主侧：为浏览器设置页提供 REST API（webServer 前缀路由
    # /dsh-science/workbench/*），复用 workbench 引擎的注册表读写/项目发现/状态汇总逻辑，
    # 供 client bundle 的「科研工作台」设置页调用。仅 bundle 形态挂载（不进 preset）。
    - id: science-workbench-ui
      name: dsh-science/engines/workbench-ui.mjs
    # 技术路线图引擎：把 issue board 升级为「技术路线图」模块 —— 节点（步骤/issue/里程碑，
    # 可自定义颜色/形状/泳道/画布坐标）+ 带类型的关系边（串联 serial / 并联 parallel /
    # 反馈 feedback / 循环 loop），外加每个节点的版本管理（语义字段变更追加版本、回滚是
    # 追加式历史永不删除；画布拖拽只改布局不进版本）。数据文件 <项目根>/.dsh/roadmap.json。
    # 工具：roadmap_init / roadmap_show / roadmap_node_add / roadmap_node_update /
    # roadmap_node_history / roadmap_node_revert / roadmap_link / roadmap_apply /
    # roadmap_layout / roadmap_render。preset「科学模式」同样挂载本引擎（agent 工具）。
    - id: science-roadmap
      name: dsh-science/engines/roadmap.mjs
    # 技术路线图画布面板的宿主侧：webServer 前缀路由 /dsh-science/roadmap/*（画布 CRUD +
    # 版本操作 + 布局/视口持久化 + mermaid 渲染），并提供两条 AI 辅助生成通路：
    #   prompt   生成可粘贴到会话的提示词（不依赖模型配置）
    #   generate 宿主侧直接发起一次 LLM 调用（ai.model 显式指定，缺省回落全局默认模型），
    #            解析模型输出的 JSON 规格后用 applySpec 原子落盘
    # 仅 bundle 形态挂载（不进 preset）。
    - id: science-roadmap-ui
      name: dsh-science/engines/roadmap-ui.mjs
      config:
        # 画布默认打开的项目根（留空时面板会把宿主进程 cwd 作为建议值，用户可在面板顶部修改）
        roadmapRoot: ""
        ai:
          # 「AI 生成」按钮使用的模型；留空则回落会话的全局默认模型。
          # 建议显式指定（与 scientific-reviewer 评审模型同理：生成与执行解耦）。
          model:
            provider: zai-coding-cn
            model: glm-5.3
            reasoningEffort: high
          maxNodes: 40
          maxTokens: 8000
          timeoutMs: 180000
    # Codex 风格侧边栏增强的宿主侧：webServer 前缀路由 /dsh-science/sidebar/*
    # （固定工作区列表持久化到 $DSH_HOME/dsh-science/sidebar.json，并提供
    # reveal/open 调系统文件管理器打开/选中工作区目录）。浏览器侧侧边栏通过
    # 该路由读写；仅 bundle 形态挂载（不进 preset）。
    - id: science-sidebar-ui
      name: dsh-science/engines/sidebar-ui.mjs
    # Biomni 模式引擎（资源宇宙 / 检索增强规划 / 计划清单 / 反思自批判）：
    # 与科研工作台/reviewer 并列的另一种研究本体——面向"宽任务快速上手"的通用生物医学
    # agent。tools 在 profile 层可见（与 research_*/artifact_*/remote_* 一致）；persona 与
    # 工作流走 preset「Biomni 模式」（preset-biomni/agent.cordis.yml）。工具：
    #   biomni_resources_list / biomni_registry_add|remove|show （资源宇宙 .biomni/registry.json）
    #   biomni_retrieve（检索增强规划，返回聚焦子集 + 计划骨架）
    #   biomni_plan_init|update|status（研究计划与状态 .biomni/plan.json）
    #   biomni_reflect|list（反思自批判 .biomni/reflect.jsonl）
    # 子路径导出（dsh-science/engines/*.mjs）；跨模块相对引用（./core.mjs、./biomni-registry.mjs）
    # 在包内解析，bundle 形态同样可用。
    - id: biomni-registry
      name: dsh-science/engines/biomni-registry.mjs
    - id: biomni-retriever
      name: dsh-science/engines/biomni-retriever.mjs
    - id: biomni-plan
      name: dsh-science/engines/biomni-plan.mjs
    - id: biomni-reflect
      name: dsh-science/engines/biomni-reflect.mjs
    # 独立自动评审引擎（HOST 平面，对齐 Claude Science 的 reviewer agent）：
    # ctx.on("agent/request") 观察主会话 turn 边界（跳过子代理会话），磁盘快照
    # diff 触发（新工件版本/假设更新/manuscript 变更），引擎只读收集执行记录后
    # 用 config.model 显式指定的评审模型经 ctx.llm.stream 发起独立评审调用
    # （不经会话、不经 model-tier 路由），结论经 research-loop 的 recordReview
    # 落盘 reviews/Rnn/ + manifest；dashboard 与 research_* 工具结果附
    # 「待处理评审」提醒；gate: true 时启用门禁（最新评审 needs-work/refuted
    # 的假设禁止经 research_findings 下结论，抛 ERR_REVIEW_GATE）。
    # 用户 profile 覆盖：- update: - id: science-scientific-reviewer  config: ...
    - id: science-scientific-reviewer
      name: dsh-science/engines/scientific-reviewer.mjs
      config:
        enabled: true
        model: # 评审模型（显式指定；建议强推理模型。缺省回落全局默认模型并 warn）
          provider: zai-coding-cn
          model: glm-5.3
          reasoningEffort: high
        triggers:
          onArtifact: true # artifacts/artifacts.json 出现新版本
          onHypothesis: true # manifest 中假设 updatedAt/status 变化（新 findings）
          onManuscript: true # manuscript/ 下文件 mtime 变化
          minIntervalSec: 180 # 同一项目两次评审最小间隔（防抖/控成本）
          maxClaimsPerReview: 10
          maxContextChars: 60000 # 喂给评审模型的执行记录总预算
        gate: false # true → 写 <root>/.reviewer/gate 标记，启用评审门禁
    # 模型分档路由（HOST 平面）：来自配套依赖包 dsh-model-tier（package.json
    # dependencies；profile 安装为 hoisted nodeLinker，包根名可解析）。
    # dsh-model-tier 也可脱离 dsh-science 单独安装到任意 profile
    # （dsh plugin add dsh-model-tier），两处条目 id 一致（model-tier），
    # 语义：注册虚拟 provider「智能分档」，会话在模型选择器选中方案后才路由
    # （按会话 opt-in，无全局路由）；未配置档位时选择器不出现方案，示例配置
    # 可安全随包发布。
    # 注意：config 与 packages/dsh-model-tier/cordis.patch.yml 保持一致。
    - id: model-tier
      name: dsh-model-tier
      config:
        tiers:
          strong:
            provider: zai-coding-cn
            model: glm-5.3
          default:
            provider: deepseek-official
            model: deepseek-v4-flash
          light:
            provider: opencode-go
            model: minimax-m2.7
        routing:
          auxiliary: [session-title, compaction]
          subagents: light
          # 深链子任务（delegationDepth >= 3）升级到强档（可选）
          subagentDepthStrong: 3
          # 单步用户输入超长时升级到强档（可选启发式，按需开启）
          # escalateOnChars: 40000
          # classify: true              # 可选：LLM 前置分类器（每次提问/子任务派发前
          #                             # 分类 light/default/strong，缺省用轻档模型）
    # 「智能分档」设置页（宿主侧 REST API /dsh-model-tier/* + 客户端 bundle）。
    # config 与上面 model-tier 行保持一致（界面展示基线）；详见
    # packages/dsh-model-tier/README.zh.md。
    - id: model-tier-ui
      name: dsh-model-tier/engines/model-tier-ui.mjs
      config:
        tiers:
          strong:
            provider: zai-coding-cn
            model: glm-5.3
          default:
            provider: deepseek-official
            model: deepseek-v4-flash
          light:
            provider: opencode-go
            model: minimax-m2.7
        routing:
          auxiliary: [session-title, compaction]
          subagents: light
          subagentDepthStrong: 3

# Optional: the research persona. It applies to ALL agents on the profile that
# picks up this bundle. For per-agent scoping (the full 科学模式 experience),
# prefer the agent-preset install path instead — see README.
