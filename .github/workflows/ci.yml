# CI —— 分支门禁（Git Flow-lite：main / dev / feat*）
#
# 触发：
#   - PR 到 dev / main
#   - push 到 dev / main
# 策略：
#   - npm test + stability：所有 PR/push 都跑（node 18/20）
#   - bundle-verify：所有 PR/push 验证固定版本 DSH 的真实安装与运行接口
#
# 用法：开发分支推 PR 即可，无需本地跑完整套件。

name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  test:
    name: Smoke + Stability (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Engine and preset tests
        run: npm test
      - name: Stability test
        run: node scripts/stability-test.mjs

  bundle-verify:
    name: Bundle verify (real dsh, release-grade)
    runs-on: ubuntu-latest
    # node >= 22.13：dsh 内部自带 pnpm 11.x（依赖 node:sqlite，node 20 不可用）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm (corepack)
        run: corepack enable
      - name: Install dsh CLI (pinned to verified version)
        run: npm install -g @deepseek-ai/dsh@0.2.0-rc.2
      - name: Verify bundle install + boot + preset schemas
        run: bash test/verify-bundle.sh
      - name: Verify standalone preset installation and reinstall
        run: bash test/verify-preset-install.sh
      - name: Verify standalone model router with local mock
        run: bash packages/dsh-model-tier/scripts/test-model-tier.sh
