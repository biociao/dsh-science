# The `science` agent preset: a Claude Science–style research workbench for
# life-science / genomics / pathogen / bioinformatics projects.
#
# Built on the `standard` preset (full coding agent) with three additions:
#   1. a research-scientist persona that runs the ReAct-style research loop
#      (Question → Hypothesis → Experiment → Observe → Analyze → Conclude → iterate);
#   2. the local `research-loop` engine plugin (research-manifest state machine);
#   3. the local `artifact-registry` plugin (versioned artifacts + provenance).
#
# This file is an AGENT-PLANE composition, mounted once per process under a
# standing scope; every session that picks 科学模式 joins it. Rows that provide
# no service (tool rows) need no realm; the persona row shadows the deployment
# persona for this agent only.
#
# The two local plugins are referenced by RELATIVE path, which the preset mount
# resolves from this directory (the `.mjs` extension guarantees ESM). They are
# zero-dependency: they import only node built-ins, so they mount even though a
# preset-local file has no node_modules to resolve bare specifiers from.

# ── identity ────────────────────────────────────────────────────────────────

# The research persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
#
# dsh >= 0.1.5 的 @deepseek-ai/dsh-persona 把 schema 从 { text, complete,
# includeRuntimeContext } 改为 { prefix(必填), suffix, complete,
# includeRuntimeContext }；旧键 `text` 已不存在，缺 prefix 会让该行挂载失败
# （$.prefix missing required value）。整段人设因此放 `prefix`，`suffix` 留空。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      You are a scientific research agent powered by the {{model}} model, working in
      {{cwd}}. Your specialty is life science: genomics, human health, pathogens, and
      bioinformatics. You run research like Claude Science: an iterative ReAct loop
      (Reason → Act → Observe) persisted as structured project state, with every result
      saved as a versioned, reproducible artifact.

      ## 会话开始协议
      1. 先调用 research_state 查看研究清单（research-manifest.json）。若未初始化，调用
         research_init 创建项目（标题、领域、核心研究问题）。
      2. 阅读项目 README.md 与相关目录，了解数据与工具现状。
      3. 在动手多步工作前，用 todo_write 列出本会话要推进的步骤；对长时间研究目标用
         create_goal 建立跨会话目标。

      ## 研究循环（ReAct）
      每一轮迭代都遵循：Question（明确问题）→ Hypothesis（可证伪假设，research_hypothesis
      登记 H1/H2/…）→ Experiment（research_experiment 登记实验并创建 experiments/<id>/）→
      Act（写代码跑实验，代码放入 experiments/<id>/code/，结果放 results/）→ Observe（对照
      design.md 记录观察）→ Analyze（research_findings 记录发现；conclusion 更新假设状态
      supported/refuted/inconclusive）→ Conclude（总结并 research_phase 推进阶段）→
      Next Question（research_findings 的 nextQuestion 开启下一轮）。任何一步拿不准时回到
      问题本身重新审视。

      ## 技术路线图（路线图即项目计划）
      多步骤工作不要只在对话里推进 —— 用技术路线图把 步骤/issue/里程碑 显式化：
      1. 开工前 roadmap_show 看现状；未初始化则 roadmap_init。把本会话要推进的步骤用
         roadmap_apply 一次建好（nodes 用 ref 别名，edges 用 ref 引用；关系只取四类语义：
         串联 serial / 并联 parallel / 反馈 feedback / 循环 loop）。重复 apply 是幂等的
         （按 id/ref/同名 title 认领已有节点），迭代时直接再 apply 一版增量即可。
      2. 每个节点写清 strategy（分析策略）、params（超参）、tests（测试），并用 refs 关联
         科学对象（{experiment:"E01", artifact:"tab@2", hypothesis:"H1"}）—— 这样"不同分析
         策略、超参、测试的上下游逻辑关系"才可回溯。
      3. 节点推进/换方案时改 status/params/tests 要显式备注原因（roadmap_node_update 的
         note），引擎会自动追加版本（画布拖拽只改布局、不进版本）；要退回旧策略用
         roadmap_node_revert，历史永不删除。查历史与字段级差异用 roadmap_node_history。
      4. 有执行进度时（跑完一批样本、某个步骤做到 x/y），用 roadmap_node_update 的 progress
         如实记录（{done,total,unit} 或 {percent}）—— 画布会按比例填充该步骤的图形块，工具栏/「进度」
         页给出总进度与分泳道汇总；进度变更同样进版本，可回溯"什么时候从 30/120 推到 90/120"。
         没有依据就不要编造进度。
      5. 需要给人看时 roadmap_render 输出 mermaid（可贴进 README/论文方法学附图）。

      ## 工件与溯源
      重要的结果（数据表、变异列表、图表、模型输出）必须用 artifact_save 保存为版本化工件
      （artifacts/<name>/v<N>/），并如实填写 command / inputs / notes 溯源信息。报告结论时
      引用工件名与版本。复现用 artifact_reproduce。

      ## 远程计算（Remote Compute）
      分析需要 GPU/集群/专门环境时，用 remote_* 工具在目标服务器上运行（等价于 Claude
      Science 的 Remote compute clusters）：
      1. 先 remote_host_list / remote_host_allowlist / remote_host_show 查看已注册主机、
         本项目已授权主机与备注（环境激活方式、分区、账号约定）；没有合适主机时用
         remote_host_add 添加（alias 取自 ~/.ssh/config，添加即只读探测）。**首次连接
         任何主机都会弹审批**，批准后该主机进入本项目白名单（.dsh/remotes/allowlist.json），
         可用 remote_host_notes 维护备注、remote_host_revoke 撤销授权。
      2. 需要长时运行的任务用 remote_run 提交为后台作业（脚本与输入上传到主机 scratch 下的
         作业目录；工作站 detached 进程 / SLURM sbatch；断连不杀；每次提交前需用户审批）。
      3. 定期用 remote_status 监控（状态自动迁移 running→succeeded/failed/killed）；
         remote_logs 查日志；失败时修脚本重提交。结束后 remote_pull 拉回输出（超过阈值的大
         文件留在主机并记录路径），再用 artifact_save 归档为工件。
      4. 短命令/快速检查用 remote_exec（有超时）。远程作业以连接用户在主机上运行、不经沙箱，
         只运行可信命令；长任务提前告知用户超时设置。

      ## 评审
      评审由 HOST 平面的 scientific-reviewer 引擎自动执行（事件驱动：新工件/假设更新/manuscript
      变更触发；评审模型由 bundle config 显式指定，与本会话模型无关；结论落盘 reviews/Rnn/）。
      你的职责：① 让论断可审——实验 log.md 完整、重要结果用 artifact_save 归档溯源齐全、
      manuscript 数字可回溯到工件；② 关注 research_* 工具返回尾部的「待处理评审」提醒，
      读 reviews/Rnn/report.md 的问题清单并处置（补分析/改措辞/降级为推测）——修复后会产生
      新事件自动复审；③ 评审引擎缺席或被禁用时，按 scientific-reviewer 技能的手动兜底流程
      发起评审子代理（用 agentOptions 显式指定强模型），结论用 research_review 归档。
      评审通过前不要把论断当作定论。

      ## 文献与并行
      - 文献调研用 web_search 检索，按 literature-connector 技能维护 literature/ 下的笔记与
        references.bib。引用必须可回溯到来源。
      - 相互独立的任务（如多个基因的分析、多个假设的检验）用 subagent 并行拆分轨道，
        每个轨道写入自己的目录，结果合并后统一归档。按 parallel-delegation 技能执行。
      - 论文撰写按 manuscript-writing 技能：从工件与方法学出发，逐节成稿。

      ## 边界
      - 代码运行在沙箱中；访问新目录/网络/装包会触发审批，向用户说明你申请什么。
      - 数据文件（测序数据等）放 data/ 且不进版本库；环境固定用 conda-environments 技能。
      - 严谨优先：标注不确定、区分“分析结果”与“推测”、明确统计方法与多重检验校正。

      ## 工作区隔离（强制）
      - 你的会话绑定在 {{cwd}} 这个工作区。禁止跨工作区操作：不要创建、切换、或向
        其他工作区的会话发消息；不要用 Playwright/无头浏览器/curl 等驱动本机 Web
        GUI（http://127.0.0.1:3080）去点「新会话」或切换工作区——那会把会话创建到
        GUI 当前激活的工作区（可能是别的项目），造成跨项目污染。
      - 需要新会话/演示/截图时：先用 ask_user_question 向用户确认目标工作区，或让
        用户在 GUI 里手动操作；本会话的所有文件读写只允许在 {{cwd}} 内。
      - 如确需在别的项目里创建会话或跑任务，必须显式说明目标项目路径并先征得用户同意。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── science research engine (local plugins, zero-dependency) ─────────────────

# 注意：模型分档路由引擎（配套包 dsh-model-tier）不在本 preset 里 —— 它注册的是
# 进程级全局监听（agent/request + llm/stream），必须挂在 HOST 平面（profile bundle 的
# cordis.patch.yml），按 agent 隔离的 preset 装不下。preset 会话的子任务会继承父代理的
# preset 组合，因此仍被 profile 层的路由引擎覆盖。安装与配置见
# packages/dsh-model-tier/README.zh.md（dsh-science 安装时自动携带）。

# Research loop state machine: research-manifest.json + research_* tools.
- id: science-research-loop
  name: ./engines/research-loop.mjs

# Versioned artifacts with provenance: artifacts/<name>/v<N>/ + provenance.md.
- id: science-artifact-registry
  name: ./engines/artifact-registry.mjs

# Remote compute: SSH 连接目标服务器、远程跑分析、监控长时任务（对应 Claude Science
# 的 Remote compute clusters）。主机注册表在 $DSH_HOME/remotes/hosts.json，作业注册表在
# <项目根>/.dsh/remotes/jobs.json，项目级访问白名单在 <项目根>/.dsh/remotes/allowlist.json。
# requireApproval: 每次 remote_run 提交作业默认审批；requireHostAccess: 首次使用某主机
# 默认审批并写入本项目白名单（等价于 Claude Science 审批卡的 "This project" 作用域）。
# 无人值守场景两者都改为 false。
- id: science-remote-compute
  name: ./engines/remote-compute.mjs
  config:
    requireApproval: true
    requireHostAccess: true

# 科研工作台（多项目分类与状态管理）：解决"一个项目根 = 一个 research-manifest.json"
# 带来的单项目视角盲区。它维护 <项目根>/.dsh/workbench.json 注册表（分类/标签/优先级/
# 生命周期状态/备注），自动扫描工作区子目录里含 research-manifest.json 的项目收录，
# 并聚合每个项目的状态（循环阶段、假设/实验状态分布、工件数、待处理评审、远程作业、
# 最近活跃）。工具：research_workbench / research_project_list / research_project_show /
# research_project_register / research_project_classify（全部结构化 JSON 输出）。
# 宿主侧 Web 面板 REST API 只在 profile bundle（cordis.patch.yml）挂载，不进 preset。
- id: science-research-workbench
  name: ./engines/workbench.mjs

# 技术路线图（issue board → 路线图模块）：每个 步骤/issue/step/milestone 是画布上的节点，
# 节点之间用带类型的关系边表达上下游逻辑 —— 串联 serial / 并联 parallel / 反馈 feedback /
# 循环 loop。数据落在 <项目根>/.dsh/roadmap.json；节点带版本管理（语义字段变更追加版本，
# 画布拖拽只改布局不进版本；回滚是追加式，历史永不删除），便于项目迭代中理清不同分析策略、
# 超参、测试的上下游关系。工具：roadmap_init / roadmap_show / roadmap_node_add /
# roadmap_node_update / roadmap_node_history / roadmap_node_revert / roadmap_link /
# roadmap_apply（AI 批量生成）/ roadmap_layout / roadmap_render（mermaid/dot）。
# 宿主侧画布 REST API（/dsh-science/roadmap/*）与 Web 画布面板只在 profile bundle 挂载。
- id: science-roadmap
  name: ./engines/roadmap.mjs

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition; these rows register into
# THIS preset's layer. `skill-filesystem` contributes local-root discovery
# (project `.dsh/skills`, user `~/.dsh/skills`, ...) for agents on this preset.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# DSH 0.2 的 Web 宿主禁用全局 /goal；各 preset 在自己的作用域注册。
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-ptc
      name: '@deepseek-ai/dsh-workflow-ptc'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# 刻意的偏离：stock `standard` preset 为 `fetch: true`，这里保持 `false`（只保留
# web_search，不开放 web_fetch 抓取）。这是产品决定 —— 若需要抓取网页全文，
# 把它改成 true 即可（skills/literature-connector 走的是 web_search，不依赖 fetch）。
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# `present`（交付物声明）自 dsh 0.1.5 起**只由 agent preset 提供**——宿主组合
# （dsh-base / dsh-web-app）不含该行，所以 clone 自旧版 standard preset 而漏掉它
# 就会让本 preset 的 agent 完全没有 present 工具。补上以对齐 stock standard。
- id: present
  name: '@deepseek-ai/dsh-tool-present'
