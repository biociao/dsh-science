  <!-- ═══════════════ Row 6 · 支撑机制 ═══════════════ -->
  <rect x="40" y="724" width="290" height="140" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="60" y="750" font-size="13.5" font-weight="700" fill="#a03a00">评审机制 Reviewer</text>
  <text x="60" y="772" font-size="11.5" fill="#5d4037">scientific-reviewer 技能：提取论断</text>
  <text x="60" y="792" font-size="11.5" fill="#5d4037">subagent_fork 只读评审子代理</text>
  <text x="60" y="812" font-size="11.5" fill="#5d4037">对照执行记录核查（日志/溯源/代码）</text>
  <text x="60" y="832" font-size="11.5" fill="#5d4037">research_review 归档 reviews/R0n/</text>
  <text x="60" y="854" font-size="11" fill="#ef6c00">=Claude Science 的 Reviewer</text>

  <rect x="342" y="724" width="290" height="140" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="362" y="750" font-size="13.5" font-weight="700" fill="#a03a00">并行委派 Delegation</text>
  <text x="362" y="772" font-size="11.5" fill="#5d4037">parallel-delegation 技能：拆轨道</text>
  <text x="362" y="792" font-size="11.5" fill="#5d4037">subagent 后台并行（自包含 prompt）</text>
  <text x="362" y="812" font-size="11.5" fill="#5d4037">analyses/tracks/ 独立目录</text>
  <text x="362" y="832" font-size="11.5" fill="#5d4037">合并 SUMMARY.md → artifact_save</text>
  <text x="362" y="854" font-size="11" fill="#ef6c00">=Claude Science 的 Delegation</text>

  <rect x="644" y="724" width="290" height="140" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="664" y="750" font-size="13.5" font-weight="700" fill="#a03a00">文献连接器 Literature</text>
  <text x="664" y="772" font-size="11.5" fill="#5d4037">literature-connector 技能</text>
  <text x="664" y="792" font-size="11.5" fill="#5d4037">web_search 检索 + 笔记</text>
  <text x="664" y="812" font-size="11.5" fill="#5d4037">literature/ + references.bib</text>
  <text x="664" y="832" font-size="11.5" fill="#5d4037">引用可回溯到来源</text>
  <text x="664" y="854" font-size="11" fill="#ef6c00">=Claude Science 的 Literature access</text>

  <rect x="946" y="724" width="290" height="140" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
  <text x="966" y="750" font-size="13.5" font-weight="700" fill="#a03a00">环境与数据 Env / Data</text>
  <text x="966" y="772" font-size="11.5" fill="#5d4037">conda-environments 技能</text>
  <text x="966" y="792" font-size="11.5" fill="#5d4037">环境导出 yaml/lock → envs/</text>
  <text x="966" y="812" font-size="11.5" fill="#5d4037">data-inventory：来源/校验值/授权</text>
  <text x="966" y="832" font-size="11.5" fill="#5d4037">data/ 不入版本库 · 复现时恢复</text>
  <text x="966" y="854" font-size="11" fill="#ef6c00">=Claude Science 的 Sandbox/Env</text>

