  <rect x="0" y="0" width="1280" height="1040" fill="#ffffff"/>

  <!-- ═══════════════ Row 1 · 用户 + DSH 宿主 ═══════════════ -->
  <rect x="40" y="16" width="240" height="64" rx="10" fill="#fce8e6" stroke="#d93025" stroke-width="1.5"/>
  <text x="160" y="42" text-anchor="middle" font-size="16" font-weight="700" fill="#7f1d1d">用户（科研人员）</text>
  <text x="160" y="64" text-anchor="middle" font-size="11.5" fill="#8c3a35">DSH Web GUI 交互 · 审批授权</text>

  <rect x="340" y="16" width="900" height="96" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="360" y="42" font-size="16" font-weight="700" fill="#174ea6">DSH 宿主运行时（DeepSeek Harness）</text>
  <text x="360" y="66" font-size="12" fill="#333f55">会话 / Agent（大模型） · cordis tools 服务 · skills 注册表（自动发现 .dsh/skills）</text>
  <text x="360" y="88" font-size="12" fill="#333f55">沙箱与审批 · 后台任务 · 目标系统 · 子代理 / 工作流 · preset 挂载点（agent 平面组合）</text>

  <line x1="280" y1="48" x2="336" y2="48" stroke="#37474f" stroke-width="1.8" marker-end="url(#ar-s)"/>

  <!-- ═══════════════ Row 2 · 安装形态 ═══════════════ -->
  <rect x="40" y="136" width="560" height="100" rx="10" fill="#f3e8fd" stroke="#7627bb" stroke-width="1.5"/>
  <text x="60" y="162" font-size="14.5" font-weight="700" fill="#4a148c">① Profile Bundle —— 全 profile 可用</text>
  <text x="60" y="184" font-size="12" fill="#4a3a5c">dsh plugin --profile web add dsh-science</text>
  <text x="60" y="204" font-size="12" fill="#4a3a5c">package.json dsh.bundle.patch → cordis.patch.yml</text>
  <text x="60" y="224" font-size="12" fill="#4a3a5c">子路径导出插入引擎：dsh-science/engines/*.mjs</text>

  <rect x="660" y="136" width="580" height="100" rx="10" fill="#f3e8fd" stroke="#7627bb" stroke-width="1.5"/>
  <text x="680" y="162" font-size="14.5" font-weight="700" fill="#4a148c">② Agent Preset「科学模式」—— 按 agent 隔离</text>
  <text x="680" y="184" font-size="12" fill="#4a3a5c">preset/agent.cordis.yml：科研人格 + 引擎 + 标准工具层</text>
  <text x="680" y="204" font-size="12" fill="#4a3a5c">相对路径挂载 ./engines/*.mjs（preset 目录解析）</text>
  <text x="680" y="224" font-size="12" fill="#4a3a5c">计划模式 / 压缩 / 委派 / 技能等组件预装</text>

  <line x1="520" y1="112" x2="330" y2="133" stroke="#37474f" stroke-width="1.8" marker-end="url(#ar-s)"/>
  <line x1="940" y1="112" x2="950" y2="133" stroke="#37474f" stroke-width="1.8" marker-end="url(#ar-s)"/>

  <!-- ═══════════════ Row 3 · 技能层 ═══════════════ -->
  <rect x="40" y="256" width="1200" height="80" rx="10" fill="#fef7e0" stroke="#e37400" stroke-width="1.5"/>
  <text x="60" y="278" font-size="14" font-weight="700" fill="#8a4b00">11 个科研技能（SKILL.md，随循环按需注入工作协议）</text>
  <text x="60" y="302" font-size="11.5" fill="#6d4c00">research-loop · science-project-setup · artifact-provenance · scientific-reviewer · literature-connector</text>
  <text x="60" y="322" font-size="11.5" fill="#6d4c00">parallel-delegation · manuscript-writing · bioinformatics-toolkit · conda-environments · data-inventory · remote-compute</text>

  <!-- ═══════════════ Row 4 · 引擎层 ═══════════════ -->
  <rect x="40" y="356" width="560" height="160" rx="10" fill="#e6f4ea" stroke="#188038" stroke-width="1.5"/>
  <text x="60" y="382" font-size="14.5" font-weight="700" fill="#0b5c23">引擎① science-research-loop（零依赖 cordis 插件）</text>
  <text x="60" y="404" font-size="12" fill="#1b5e20">ReAct 研究循环状态机 —— research_* 工具（7 个）</text>
  <g font-size="10.5" fill="#0b3d17">
    <rect x="60" y="416" width="122" height="26" rx="13" fill="#c8e6c9" stroke="#4caf50" stroke-width="1"/><text x="121" y="434" text-anchor="middle">research_init</text>
    <rect x="190" y="416" width="128" height="26" rx="13" fill="#c8e6c9" stroke="#4caf50" stroke-width="1"/><text x="254" y="434" text-anchor="middle">research_state</text>
    <rect x="326" y="416" width="150" height="26" rx="13" fill="#c8e6c9" stroke="#4caf50" stroke-width="1"/><text x="401" y="434" text-anchor="middle">research_hypothesis</text>
    <rect x="60" y="448" width="152" height="26" rx="13" fill="#c8e6c9" stroke="#4caf50" stroke-width="1"/><text x="136" y="466" text-anchor="middle">research_experiment</text>
    <rect x="220" y="448" width="140" height="26" rx="13" fill="#c8e6c9" stroke="#4caf50" stroke-width="1"/><text x="290" y="466" text-anchor="middle">research_findings</text>
    <rect x="368" y="448" width="126" height="26" rx="13" fill="#c8e6c9" stroke="#4caf50" stroke-width="1"/><text x="431" y="466" text-anchor="middle">research_phase</text>
    <rect x="502" y="448" width="88" height="26" rx="13" fill="#c8e6c9" stroke="#4caf50" stroke-width="1"/><text x="546" y="466" text-anchor="middle">review</text>
  </g>
  <text x="60" y="498" font-size="11" fill="#1b5e20">inject:["tools"] → apply(ctx) 注册 · 幂等 · 自动探测项目根（.dsh/.git）</text>

  <rect x="660" y="356" width="580" height="160" rx="10" fill="#e6f4ea" stroke="#188038" stroke-width="1.5"/>
  <text x="680" y="382" font-size="14.5" font-weight="700" fill="#0b5c23">引擎② science-artifact-registry（零依赖 cordis 插件）</text>
  <text x="680" y="404" font-size="12" fill="#1b5e20">版本化工件与溯源 —— artifact_* 工具（4 个）</text>
  <g font-size="10.5" fill="#0b3d17">
    <rect x="680" y="416" width="122" height="26" rx="13" fill="#c8e6c9" stroke="#4caf50" stroke-width="1"/><text x="741" y="434" text-anchor="middle">artifact_save</text>
    <rect x="810" y="416" width="122" height="26" rx="13" fill="#c8e6c9" stroke="#4caf50" stroke-width="1"/><text x="871" y="434" text-anchor="middle">artifact_list</text>
    <rect x="940" y="416" width="122" height="26" rx="13" fill="#c8e6c9" stroke="#4caf50" stroke-width="1"/><text x="1001" y="434" text-anchor="middle">artifact_show</text>
    <rect x="1070" y="416" width="152" height="26" rx="13" fill="#c8e6c9" stroke="#4caf50" stroke-width="1"/><text x="1146" y="434" text-anchor="middle">artifact_reproduce</text>
  </g>
  <text x="680" y="498" font-size="11" fill="#1b5e20">每文件 SHA-256 · 路径越界防护 · provenance.md 追加式 · artifacts.json 全局索引</text>

