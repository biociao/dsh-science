  <!-- ═══════════════ Row 5 · 持久化层 ═══════════════ -->
  <rect x="40" y="540" width="380" height="160" rx="10" fill="#e0f2f1" stroke="#00796b" stroke-width="1.5"/>
  <text x="60" y="566" font-size="14" font-weight="700" fill="#004d40">研究清单 research-manifest.json</text>
  <text x="60" y="590" font-size="12" fill="#274b45">· 核心研究问题 · 假设 H1/H2…（状态机）</text>
  <text x="60" y="610" font-size="12" fill="#274b45">· loop{phase, iteration, history}</text>
  <text x="60" y="630" font-size="12" fill="#274b45">· 实验 E01… · 工件 · 评审</text>
  <text x="60" y="650" font-size="12" fill="#274b45">· 阶段：literature→hypothesis→experiment</text>
  <text x="60" y="670" font-size="12" fill="#274b45">  →analysis→manuscript→concluded</text>
  <text x="60" y="690" font-size="11" fill="#00796b">跨会话持续（=Claude Science 的 Project）</text>

  <rect x="450" y="540" width="380" height="160" rx="10" fill="#e0f2f1" stroke="#00796b" stroke-width="1.5"/>
  <text x="470" y="566" font-size="14" font-weight="700" fill="#004d40">项目骨架目录（research_init 创建）</text>
  <text x="470" y="590" font-size="12" fill="#274b45">experiments/&lt;id&gt;/{design.md, log.md,</text>
  <text x="470" y="610" font-size="12" fill="#274b45">  code/, results/}</text>
  <text x="470" y="630" font-size="12" fill="#274b45">literature/ · analyses/ · figures/</text>
  <text x="470" y="650" font-size="12" fill="#274b45">manuscript/ · reviews/ · data/ · envs/</text>
  <text x="470" y="670" font-size="12" fill="#274b45">README.md · .gitignore（data/ 不入库）</text>
  <text x="470" y="690" font-size="11" fill="#00796b">自动探测项目根（.dsh / .git 标记）</text>

  <rect x="860" y="540" width="380" height="160" rx="10" fill="#e0f2f1" stroke="#00796b" stroke-width="1.5"/>
  <text x="880" y="566" font-size="14" font-weight="700" fill="#004d40">版本化工件 artifacts/&lt;name&gt;/</text>
  <text x="880" y="590" font-size="12" fill="#274b45">v1/ v2/ … 每次保存一个新版本</text>
  <text x="880" y="610" font-size="12" fill="#274b45">artifact.json：命令/输入/备注/环境</text>
  <text x="880" y="630" font-size="12" fill="#274b45">provenance.md：追加式溯源日志</text>
  <text x="880" y="650" font-size="12" fill="#274b45">artifacts.json：全局索引</text>
  <text x="880" y="670" font-size="12" fill="#274b45">每文件 SHA-256（复现一致性校验）</text>
  <text x="880" y="690" font-size="11" fill="#00796b">=Claude Science 的 Artifacts + Provenance</text>

