  <!-- ═══════════════ 图例 ═══════════════ -->
  <text x="40" y="1012" font-size="11.5" fill="#37474f">
    <tspan font-weight="700">图例：</tspan>
    <tspan fill="#37474f">— 实线 = 挂载 / 调用 / 读写</tspan>
    <tspan fill="#8a8f98">　- - 虚线 = 按需触发 / 归档 / 回写</tspan>
